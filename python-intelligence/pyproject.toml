[project]
name = "premierpro-intelligence"
version = "0.1.0"
description = "AI/NLP intelligence service for PremierPro MCP — script parsing, EDL generation, asset matching, and pacing analysis"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "protobuf>=7.35.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0",
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["../gen/python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Protobuf RPC method names are fixed by the service contract.
"src/grpc_server.py" = ["N802"]
# This module must add generated stubs to sys.path before importing the server.
"src/main.py" = ["E402"]
# Retain the existing ``str, Enum`` string representation for compatibility.
"src/models.py" = ["UP042"]

[tool.mypy]
python_version = "3.12"
mypy_path = "../gen/python"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = ["grpc", "openai"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated protobuf/grpc modules are checked at generation time. Their
# third-party annotations are not strict-mypy clean, but their public types
# remain available to the handwritten service code.
module = [
    "premierpro.common.v1.common_pb2",
    "premierpro.intelligence.v1.intelligence_pb2",
    "premierpro.intelligence.v1.intelligence_pb2_grpc",
]
ignore_errors = true
